# /etc/nginx/sites-available/info.vandmark.com
# Nginx configuration for Vandmark Django Project

upstream django_vandmark {
    server 127.0.0.1:8000;
    # Or unix socket:
    # server unix:/run/vandmark/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name info.vandmark.com;

    # Client upload size (for video/media uploads)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static files served directly by Nginx
    location /static/ {
        alias /var/www/vandmark-site/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media files served directly by Nginx
    location /media/ {
        alias /var/www/vandmark-site/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy to Django Gunicorn application
    location / {
        proxy_pass http://django_vandmark;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90;
    }
}
